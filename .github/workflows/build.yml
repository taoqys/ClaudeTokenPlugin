name: Build Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build with CMake
      run: |
        cmake -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
        cmake --build build

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: ClaudeTokenPlugin
        path: build/bin/ClaudeTokenPlugin.dll
